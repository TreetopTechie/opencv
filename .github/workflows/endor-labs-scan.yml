name: Endor Labs Security Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  endor-labs-scan:
    permissions:
      security-events: write # Used to upload Sarif artifact to GitHub
      contents: read # Used to check out a private repository
      actions: read # Required for private repositories to upload Sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication with Endor Labs
      pull-requests: write # Required to automatically comment on PRs for new policy violations
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 'Endor Labs Scan'
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: endorlabs/github-action@v1.1.8 # Replace with the commit SHA of the latest version of the GitHub Action for enhanced security
        with:
          namespace: 'david-learn' # Replace with your Endor Labs tenant namespace
          additional_args: '--languages=c,javascript' # Required for c/c++ projects. If you are using other languages, you can add them here.
          scan_dependencies: true
          scan_secrets: true
          pr: false
          scan_summary_output_type: 'table'
          sarif_file: 'findings.sarif'


      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: findings.sarif

